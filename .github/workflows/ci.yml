name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      # Regenerate the platform folders that are intentionally gitignored.
      - name: Generate platforms
        run: flutter create . --platforms=android,web

      - name: Dependencies
        run: flutter pub get

      # Informational only: style lints must not block the pipeline.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        continue-on-error: true

      # --- Real compile gate: these must pass ---
      - name: Tests
        run: flutter test

      - name: Build web
        run: flutter build web --release

      # Android toolchain on runners is flaky and is NOT needed to verify
      # the Dart code compiles; keep it best-effort so it can't red the run.
      - name: Build Android (debug)
        id: apk
        continue-on-error: true
        run: flutter build apk --debug

      - name: Upload APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: buff-battle-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
