name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      # Regenerate the platform folders that are intentionally gitignored.
      - name: Generate platforms
        run: flutter create . --platforms=android,web

      - name: Dependencies
        run: flutter pub get

      # Informational: style lints should not block the pipeline.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        continue-on-error: true

      - name: Tests
        run: flutter test

      # The real compile gate.
      - name: Build web
        run: flutter build web --release

      - name: Build Android (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buff-battle-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
